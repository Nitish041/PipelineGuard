sonar.projectKey=devsecops-ci-cd-demo
sonar.projectName=DevSecOps CI/CD Pipeline Demo
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,frontend/test
sonar.test.inclusions=backend/test/**/*.test.ts,frontend/test/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.*,**/src/main.tsx,**/src/test-setup.ts
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
