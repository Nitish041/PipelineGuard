name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BLOCKING_SEVERITIES: HIGH,CRITICAL

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/setup-node@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d490e58b9c6bb1d3b87313fbe3a # v4.0.4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info
          if-no-files-found: warn

  sonarqube:
    name: SonarQube analysis and Quality Gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d490e58b9c6bb1d3b87313fbe3a # v4.0.4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and generate coverage
        run: npm ci && npm run coverage
      - name: Require SonarQube credentials
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo 'SONAR_HOST_URL secret is required'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo 'SONAR_TOKEN secret is required'; exit 1; }
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Wait for SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  trivy-filesystem:
    name: Trivy filesystem, secrets and configuration
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          version: v0.76.1
          trivy-config: trivy.yaml
          severity: ${{ env.BLOCKING_SEVERITIES }}
          exit-code: '1'
          format: sarif
          output: trivy-fs.sarif
      - name: Trivy secret scan
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          version: v0.76.1
          severity: ${{ env.BLOCKING_SEVERITIES }}
          exit-code: '1'
          format: json
          output: trivy-secrets.json
      - name: Trivy configuration scan
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          version: v0.76.1
          severity: ${{ env.BLOCKING_SEVERITIES }}
          exit-code: '1'
          format: json
          output: trivy-config.json
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-source-reports
          path: trivy-*.{sarif,json}
          if-no-files-found: warn
  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [verify, sonarqube, trivy-filesystem]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t devsecops-demo-backend:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t devsecops-demo-frontend:${{ github.sha }} .
      - name: Save images
        run: docker save devsecops-demo-backend:${{ github.sha }} devsecops-demo-frontend:${{ github.sha }} -o images.tar
      - name: Upload image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-images
          path: images.tar
          retention-days: 1

  trivy-image:
    name: Trivy container image scan
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Download images
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4.1.8
        with:
          name: container-images
      - name: Load images
        id: load_images
        run: docker load -i images.tar
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: devsecops-demo-backend:${{ github.sha }}
          scanners: vuln
          version: v0.76.1
          severity: ${{ env.BLOCKING_SEVERITIES }}
          exit-code: '1'
          format: json
          output: trivy-backend-image.json
      - name: Scan frontend image
        if: always() && steps.load_images.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: devsecops-demo-frontend:${{ github.sha }}
          scanners: vuln
          version: v0.76.1
          severity: ${{ env.BLOCKING_SEVERITIES }}
          exit-code: '1'
          format: json
          output: trivy-frontend-image.json
      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-image-reports
          path: trivy-*-image.json
          if-no-files-found: warn

